/* =========================================================
   URBAN ROOM — Design Tokens · System B / INTERLOCK
   Sand · ink · clay  ·  Manrope + JetBrains Mono
   --------------------------------------------------------- */

@import url("https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;600;700;800;900&family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap");

:root {
  /* ---------- Surface — warm sand spine (CI) ---------- */
  --ur-bg:           #F2EDE3;
  --ur-bg-soft:      #ECE5D6;
  --ur-bg-muted:     #E3DAC6;
  --ur-bg-bright:    #FAF6EC;
  --ur-line:         #D4C9B0;
  --ur-line-strong:  #BFB29A;

  /* ---------- Ink (CI) ---------- */
  --ur-ink:          #1B1A17;
  --ur-ink-2:        #3A3631;
  --ur-ink-3:        #6B6359;
  --ur-ink-4:        #948B7E;

  /* ---------- Accent — clay, sparingly (CI) ---------- */
  --ur-accent:       #C2563A;
  --ur-accent-soft:  #E8B8A6;
  --ur-accent-deep:  #9A3F26;

  /* Semantic states */
  --ur-success:      #4E6B3D;
  --ur-warn:         #B98432;
  --ur-error:        #9A3F26;

  /* Semantic — bind these, not the raw palette */
  --ur-fg:           var(--ur-ink);
  --ur-fg-muted:     var(--ur-ink-3);
  --ur-surface:      var(--ur-bg);

  /* ---------- Type (CI) ---------- */
  --ur-display: "Archivo", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  --ur-sans:    "Manrope", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  --ur-mono:    "JetBrains Mono", ui-monospace, Menlo, monospace;

  /* Type scale */
  --ur-fs-xs:   11px;
  --ur-fs-sm:   13px;
  --ur-fs-base: 15px;
  --ur-fs-md:   17px;
  --ur-fs-lg:   20px;
  --ur-fs-xl:   28px;
  --ur-fs-2xl:  40px;
  --ur-fs-3xl:  56px;
  --ur-fs-4xl:  72px;
  --ur-fs-5xl:  96px;

  /* Spacing — 8pt with 4pt half-step */
  --ur-s-1: 4px;  --ur-s-2: 8px;  --ur-s-3: 12px;
  --ur-s-4: 16px; --ur-s-5: 24px; --ur-s-6: 32px;
  --ur-s-7: 48px; --ur-s-8: 64px; --ur-s-9: 96px; --ur-s-10: 144px;

  /* Radii — subtle */
  --ur-r-0: 0;
  --ur-r-1: 2px;
  --ur-r-2: 4px;
  --ur-r-3: 8px;
  --ur-r-pill: 999px;

  /* Borders */
  --ur-border-hair: 1px solid var(--ur-line);
  --ur-border-soft: 1px solid var(--ur-line);
  --ur-border-ink:  1px solid var(--ur-ink);

  /* Shadows */
  --ur-shadow-0: none;
  --ur-shadow-1: 0 1px 0 rgba(27,26,23,0.05);
  --ur-shadow-2: 0 8px 24px -16px rgba(27,26,23,0.18);
  --ur-shadow-3: 0 24px 48px -28px rgba(27,26,23,0.25);

  /* Motion */
  --ur-ease:     cubic-bezier(0.22, 0.61, 0.36, 1);
  --ur-ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ur-dur-1: 120ms;
  --ur-dur-2: 220ms;
  --ur-dur-3: 420ms;
  --ur-dur-4: 800ms;

  --ur-container: 1240px;
  --ur-gutter: 32px;
}

.ur-root *, .ur-root *::before, .ur-root *::after { box-sizing: border-box; }
.ur-rule       { height: 1px; background: var(--ur-line); border: 0; }
.ur-rule--ink  { height: 1px; background: var(--ur-ink);  border: 0; }

  html, body { margin: 0; padding: 0; }
  body { background: var(--ur-bg); color: var(--ur-ink); font-family: var(--ur-sans); }
  ::selection { background: var(--ur-ink); color: var(--ur-bg); }
  a { color: inherit; }

  /* ---------- Section system ---------- */
  .ur-section          { padding: 96px 40px; }
  .ur-section__inner   { max-width: 1320px; margin: 0 auto; }
  .ur-section__head    { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 48px; gap: 32px; flex-wrap: wrap; }
  .ur-section__title   { font-family: var(--ur-display); font-weight: 700; font-size: 32px; line-height: 1.05; letter-spacing: -0.025em; color: var(--ur-ink); margin: 0; }
  .ur-section__link    { font-family: var(--ur-sans); font-weight: 500; font-size: 13px; color: var(--ur-ink); text-decoration: none; border-bottom: 1px solid var(--ur-ink); padding-bottom: 3px; display: inline-flex; align-items: center; gap: 8px; transition: gap 220ms var(--ur-ease); }
  .ur-section__link:hover { gap: 14px; }
  .ur-card-hover { transition: transform 320ms var(--ur-ease); }
  .ur-card-hover:hover { transform: translateY(-4px); }

  /* ---------- Responsive layout ---------- */
  .ur-expertise        { padding: 80px 40px; }
  .ur-expertise-intro  { display: grid; grid-template-columns: 1fr 2.2fr; gap: 56px; align-items: baseline; margin-bottom: 36px; }

  .ur-grid-proj        { display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 32px; row-gap: 72px; }
  .ur-grid-chan        { display: grid; grid-template-columns: repeat(2, 1fr); column-gap: 40px; row-gap: 64px; }
  .ur-footer-grid      { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 48px; align-items: start; }
  .ur-drawer-body      { padding: 48px 56px 64px; }
  .ur-nav-toggle       { display: none; }

  @media (max-width: 900px) {
    .ur-section        { padding: 72px 24px; }

/* global React */
const { useState } = React;

/* ---------- Eyebrow ---------- */
function Eyebrow({ children }) {
  return (
    <span style={{ fontFamily: "var(--ur-sans)", fontWeight: 600, fontSize: 11, letterSpacing: "0.22em", textTransform: "uppercase", color: "var(--ur-ink-3)" }}>{children}</span>);

}

/* ---------- Button ---------- */
function Button({ variant = "primary", children, onClick, icon }) {
  const base = {
    fontFamily: "var(--ur-sans)", fontWeight: 500, fontSize: 14, letterSpacing: "0.01em",
    padding: "13px 24px", borderRadius: 2, border: 0, cursor: "pointer",
    display: "inline-flex", alignItems: "center", gap: 10,
    transition: "all 220ms cubic-bezier(.22,.61,.36,1)"
  };
  const styles = {
    primary: { ...base, background: "var(--ur-ink)", color: "#fff" },
    ghost: { ...base, background: "transparent", color: "var(--ur-ink)", border: "1px solid var(--ur-ink)" },
    accent: { ...base, background: "var(--ur-accent)", color: "#fff" },
    link: { ...base, background: "transparent", color: "var(--ur-ink)", padding: "4px 0", borderRadius: 0, borderBottom: "1px solid var(--ur-accent)" }
  };
  return (
    <button style={styles[variant]} onClick={onClick}
    onMouseEnter={(e) => {if (variant === "primary") e.currentTarget.style.background = "var(--ur-navy-2)";}}
    onMouseLeave={(e) => {if (variant === "primary") e.currentTarget.style.background = "var(--ur-ink)";}}>
      {children}{icon && <span>{icon}</span>}
    </button>);

}

/* ---------- Field ---------- */
function Field({ label, type = "text", value, onChange, multiline }) {
  const sty = {
    fontFamily: "var(--ur-sans)", fontSize: 14, padding: "12px 14px",
    border: "1px solid var(--ur-line-strong)", background: "#fff", color: "var(--ur-ink)",
    borderRadius: 2, outline: 0, width: "100%", boxSizing: "border-box"
  };
  return (
    <label style={{ display: "flex", flexDirection: "column", gap: 6 }}>
      <span style={{ fontFamily: "var(--ur-sans)", fontSize: 11, letterSpacing: "0.18em", textTransform: "uppercase", color: "var(--ur-ink-3)", fontWeight: 600 }}>{label}</span>
      {multiline ?
      <textarea style={{ ...sty, minHeight: 110, resize: "vertical" }} value={value} onChange={(e) => onChange(e.target.value)} /> :
      <input style={sty} type={type} value={value} onChange={(e) => onChange(e.target.value)} />}
    </label>);

}

/* ---------- Chip ---------- */
function Chip({ active, onClick, children }) {
  return (
    <button onClick={onClick} style={{
      padding: "8px 16px", border: `1px solid ${active ? "var(--ur-ink)" : "var(--ur-line-strong)"}`,
      borderRadius: 999, fontFamily: "var(--ur-sans)", fontSize: 13,
      color: active ? "#fff" : "var(--ur-ink-2)", background: active ? "var(--ur-ink)" : "#fff",
      cursor: "pointer", transition: "all 220ms"
    }}>{children}</button>);

}

/* ---------- Plate — real photography, or tone gradient as fallback ---------- */
function Plate({ ratio = "16/10", tone = "navy", src, overlay, fill }) {
  const tones = {
    navy: "linear-gradient(180deg,#3a4a66 0%,#1A2438 100%)",
    earth: "linear-gradient(180deg,#7d6855 0%,#3d2f24 100%)",
    forest: "linear-gradient(180deg,#5a6d5f 0%,#2c3e34 100%)",
    rose: "linear-gradient(180deg,#9c6a5e 0%,#4d2e26 100%)",
    sand: "linear-gradient(180deg,#a89678 0%,#5b4d35 100%)",
    grey: "linear-gradient(180deg,#7a8290 0%,#34404f 100%)",
    stone: "linear-gradient(180deg,#b8b0a2 0%,#766e60 100%)"
  };
  const bg = src
    ? { backgroundImage: `url(${src}), ${tones[tone] || tones.navy}`, backgroundSize: "cover, cover", backgroundPosition: "center, center", backgroundRepeat: "no-repeat, no-repeat" }
    : { background: tones[tone] || tones.navy };
  return (
    <div style={{ aspectRatio: ratio === "auto" ? undefined : ratio, height: ratio === "auto" ? "100%" : undefined, ...bg, position: "relative", overflow: "hidden", width: "100%" }}>
      {fill}
      {overlay}
    </div>);

}

/* Typographic cover for film entries — client name as text, no face thumbnail */
function coverOverlay(title, kicker, big) {
  return (
    <div style={{ position: "absolute", inset: 0, padding: big ? "44px 48px" : "20px 22px", display: "flex", flexDirection: "column", justifyContent: "flex-end", background: "linear-gradient(180deg, rgba(20,18,15,0) 45%, rgba(20,18,15,0.55) 100%)" }}>
      {kicker &&
      <div style={{ fontFamily: "var(--ur-mono)", fontSize: big ? 11 : 10, letterSpacing: "0.2em", textTransform: "uppercase", color: "rgba(255,255,255,0.6)", marginBottom: big ? 12 : 7 }}>{kicker}</div>}
      <div style={{ fontFamily: "var(--ur-display)", fontWeight: 700, fontSize: big ? 40 : 22, lineHeight: 1.06, letterSpacing: "-0.025em", color: "#fff" }}>{title}</div>
    </div>);

}

const Icon = {

  pin: (s = 18) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 1118 0z" /><circle cx="12" cy="10" r="3" /></svg>,

  ig: (s = 18) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="4" /><circle cx="12" cy="12" r="4" /><circle cx="17.5" cy="6.5" r="0.5" fill="currentColor" /></svg>,
  yt: (s = 18) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="6" width="20" height="12" rx="3" /><path d="M10 9.5v5l4-2.5z" /></svg>,
  fb: (s = 18) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M14 9V6.5A1.5 1.5 0 0115.5 5H17V2h-2.5A4.5 4.5 0 0010 6.5V9H8v3h2v10h4V12h2.5l.5-3H14z" /></svg>,
  download: (s = 18) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14" /></svg>,
  menu: (s = 18) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M4 7h16M4 12h16M4 17h10" /></svg>
};

Object.assign(window, { Eyebrow, Button, Field, Chip, Plate, Icon });

/* ---------- Wordmark (CI logo) ---------- */
function Wordmark({ size = 22, color = "var(--ur-ink)", variant = "inline" }) {
  const stacked = variant === "stacked";
  return (
    <span
      aria-label="urbanROOM"
      style={{
        fontFamily: "Archivo, system-ui, sans-serif",
        color,
        letterSpacing: "-0.04em",
        lineHeight: stacked ? 0.95 : 1,
        display: stacked ? "flex" : "inline-flex",
        flexDirection: stacked ? "column" : "row",
        alignItems: stacked ? "center" : "baseline",
        fontSize: size,
        textTransform: "none"
      }}>
      
      <span style={{ fontWeight: 300 }}>urban</span>
      <span style={{ fontWeight: 900 }}>ROOM</span>
    </span>);

}
Object.assign(window, { Wordmark });

/* ---------- Drawer (slide-in panel) ---------- */
function Drawer({ open, onClose, children, width = 720 }) {
  React.useEffect(() => {
    if (!open) return;
    const onKey = (e) => e.key === "Escape" && onClose();
    window.addEventListener("keydown", onKey);
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => {window.removeEventListener("keydown", onKey);document.body.style.overflow = prev;};
  }, [open, onClose]);
  return (
    <>
      <div onClick={onClose} style={{
        position: "fixed", inset: 0, background: "rgba(27,26,23,0.55)",
        opacity: open ? 1 : 0, pointerEvents: open ? "auto" : "none",
        transition: "opacity 280ms ease", zIndex: 50
      }} />
      <div role="dialog" aria-modal="true" style={{
        position: "fixed", top: 0, right: 0, bottom: 0,
        width, maxWidth: "94vw", background: "var(--ur-bg)",
        transform: open ? "translateX(0)" : "translateX(100%)",
        transition: "transform 360ms cubic-bezier(.22,.61,.36,1)",
        zIndex: 51, overflow: "auto", boxShadow: "-24px 0 60px -20px rgba(27,26,23,0.25)"
      }}>
        <div style={{ position: "sticky", top: 0, height: 0, zIndex: 3, pointerEvents: "none" }}>
          <button onClick={onClose} aria-label="Close" style={{
            position: "absolute", top: 16, right: 16, pointerEvents: "auto",
            width: 38, height: 38, borderRadius: 999, border: 0, cursor: "pointer",
            background: "rgba(27,26,23,0.72)", color: "#fff",
            display: "grid", placeItems: "center"
          }}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>
        {children}
      </div>
    </>);

}
Object.assign(window, { Drawer });

const HERO_BGS = [
  "assets/images/hero/hero-01.jpg",
  "assets/images/hero/hero-02.jpg",
  "assets/images/hero/hero-03.jpg",
  "assets/images/hero/hero-04.jpg"];

function Hero() {
  const [idx, setIdx] = React.useState(0);
  React.useEffect(() => {
    const t = setInterval(() => setIdx((i) => (i + 1) % HERO_BGS.length), 5500);
    return () => clearInterval(t);
  }, []);
  return (
    <section style={{ position: "relative", height: "100vh", minHeight: 640, maxHeight: 960, overflow: "hidden" }}>
      {/* rotating background images */}
      {HERO_BGS.map((src, i) =>
      <div key={src} style={{ position: "absolute", inset: 0, opacity: i === idx ? 1 : 0, transition: "opacity 1400ms ease", backgroundImage: `url(${src})`, backgroundSize: "cover", backgroundPosition: "center" }} />
      )}
      {/* top vignette so header reads */}
      <div style={{ position: "absolute", left: 0, right: 0, top: 0, height: 180, background: "linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 100%)", pointerEvents: "none" }} />
      {/* bottom gradient so caption is readable */}
      <div style={{ position: "absolute", inset: 0, background: "linear-gradient(180deg, rgba(0,0,0,0) 45%, rgba(0,0,0,0.45) 100%)", pointerEvents: "none" }} />
      {/* caption */}
      <div style={{ position: "absolute", left: 0, right: 0, bottom: 0, padding: "0 40px 56px" }}>
        <div style={{ maxWidth: 1320, margin: "0 auto" }}>
          {/* slide indicator */}
          <div style={{ display: "flex", gap: 8 }}>
            {HERO_BGS.map((_, i) =>
            <button key={i} onClick={() => setIdx(i)} aria-label={`Slide ${i + 1}`} style={{ width: 32, height: 2, background: i === idx ? "#fff" : "rgba(255,255,255,0.3)", border: 0, padding: 0, cursor: "pointer", transition: "background 400ms" }} />
            )}
          </div>
        </div>
      </div>
    </section>);

}

/* ============================ FILM CARD — clip thumbnail (YouTube or Facebook), used in project drawer ============================ */
function FilmCard({ clip, tone = "navy", label }) {
  const isFb = !!clip.fb;
  const href = isFb ? `https://www.facebook.com/reel/${clip.fb}` : `https://www.youtube.com/watch?v=${clip.yt}`;
  const src = clip.img || (clip.yt ? `https://i.ytimg.com/vi/${clip.yt}/maxresdefault.jpg` : null);
  const platform = isFb ? "Facebook · Reel" : "YouTube";
  return (
    <a href={href} target="_blank" rel="noreferrer" className="ur-card-hover"
    style={{ display: "block", textDecoration: "none", color: "inherit" }}>
      <div style={{ position: "relative" }}>
        <Plate tone={tone} src={src} ratio="16/9"
          overlay={!src ? coverOverlay(label, platform, false) : null} />
        <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", background: "rgba(27,26,23,0.12)" }}>
          <div style={{ width: 60, height: 60, borderRadius: 999, background: "rgba(255,255,255,0.94)", display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "0 10px 30px -14px rgba(0,0,0,0.5)" }}>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="var(--ur-ink)"><path d="M8 5v14l11-7L8 5z" /></svg>
          </div>
        </div>
        {src &&
        <span style={{ position: "absolute", left: 12, bottom: 12, fontFamily: "var(--ur-mono)", fontSize: 10, letterSpacing: "0.08em", color: "#fff", background: "rgba(27,26,23,0.78)", padding: "3px 8px", textTransform: "uppercase" }}>

/* global React, ReactDOM, Header, Hero, Expertise, ProjectGrid, Channel, Partners, Footer */

const NAV_TARGETS = { Expertise: "expertise", Projects: "projects", Channel: "channel", Contact: "contact" };

function scrollToId(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const top = el.getBoundingClientRect().top + window.scrollY - 64;
  window.scrollTo({ top, behavior: "smooth" });
}

function App() {
  const [active, setActive] = useState("Expertise");
  const [project, setProject] = useState(null);
  const [menuOpen, setMenuOpen] = useState(false);

  const handleNav = (label) => {
    setActive(label);
    setMenuOpen(false);
    const id = NAV_TARGETS[label];
    if (id) scrollToId(id);
  };

  return (
    <div data-screen-label="urbanROOM — Marketing site">
      <Header active={active} onNav={handleNav} onMenu={() => setMenuOpen(true)} onLight={true} />
      <main>
        <Hero />
        <Expertise />
        <ProjectGrid onOpen={setProject} />
        <Channel />
      </main>
      <Footer />
      <Drawer open={!!project} onClose={() => setProject(null)} width={760}>
        <ProjectDetail p={project} />
      </Drawer>
      <Drawer open={menuOpen} onClose={() => setMenuOpen(false)} width={420}>
        <NavMenu active={active} onNav={handleNav} />
      </Drawer>
    </div>);

}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
